<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .t{font-size:14px;font-weight:600;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .l{font-size:11px;fill:#334155}
      .lbl{font-size:11px;fill:#334155;paint-order:stroke;stroke:#ffffff;stroke-width:4px}
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;rx:10}
      .app{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4;rx:10}
      .data{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.4;rx:10}
      .sec{fill:#fefce8;stroke:#ca8a04;stroke-width:1.4;rx:10}
      .ext{fill:#faf5ff;stroke:#9333ea;stroke-width:1.4;rx:10}
      .ln{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#64748b;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#ag)}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#f8fafc"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">ShipOps on Microsoft Azure: target architecture</text>
  <text x="30" y="58" class="s">Region: Central India (DR pair: South India). All service-to-service auth via Managed Identity; secrets in Key Vault; data plane on private endpoints.</text>

  <!-- Users -->
  <rect x="30" y="330" width="180" height="76" class="box"/>
  <text x="120" y="360" text-anchor="middle" class="t">Internal users</text>
  <text x="120" y="380" text-anchor="middle" class="s">Browser (React SPA)</text>
  <text x="120" y="396" text-anchor="middle" class="s">HTTPS + WSS</text>

  <!-- Entra -->
  <rect x="260" y="80" width="220" height="74" class="sec"/>
  <text x="370" y="108" text-anchor="middle" class="t">Microsoft Entra ID</text>
  <text x="370" y="127" text-anchor="middle" class="s">App registrations: SPA + API</text>
  <text x="370" y="143" text-anchor="middle" class="s">App roles · MFA · Conditional Access</text>

  <!-- Front Door -->
  <rect x="260" y="320" width="220" height="96" class="box"/>
  <text x="370" y="350" text-anchor="middle" class="t">Azure Front Door Premium</text>
  <text x="370" y="369" text-anchor="middle" class="s">WAF (OWASP rules), TLS, CDN</text>
  <text x="370" y="386" text-anchor="middle" class="s">/ → web · /api, /ws → api</text>
  <text x="370" y="403" text-anchor="middle" class="s">(optional; App Service direct is fine)</text>

  <!-- ACR + GitHub -->
  <rect x="30" y="640" width="180" height="70" class="box"/>
  <text x="120" y="668" text-anchor="middle" class="t">GitHub Actions</text>
  <text x="120" y="687" text-anchor="middle" class="s">CI: test · build · scan</text>
  <text x="120" y="702" text-anchor="middle" class="s">OIDC federated login</text>
  <rect x="260" y="640" width="220" height="70" class="box"/>
  <text x="370" y="668" text-anchor="middle" class="t">Azure Container Registry</text>
  <text x="370" y="687" text-anchor="middle" class="s">Images: web · api · analytics</text>
  <text x="370" y="702" text-anchor="middle" class="s">AcrPull via Managed Identity</text>

  <!-- Fabric + Monitor -->
  <rect x="560" y="80" width="280" height="74" class="ext"/>
  <text x="700" y="108" text-anchor="middle" class="t">Microsoft Fabric (OneLake)</text>
  <text x="700" y="127" text-anchor="middle" class="s">Mirrored PostgreSQL DB (Delta)</text>
  <text x="700" y="143" text-anchor="middle" class="s">Lakehouse · Power BI (Direct Lake)</text>
  <rect x="900" y="80" width="330" height="74" class="box"/>
  <text x="1065" y="108" text-anchor="middle" class="t">Application Insights + Log Analytics</text>
  <text x="1065" y="127" text-anchor="middle" class="s">OpenTelemetry traces, JSON logs, metrics</text>
  <text x="1065" y="143" text-anchor="middle" class="s">Alerts: 5xx rate, p95 latency, DB CPU</text>

  <!-- VNet -->
  <rect x="520" y="180" width="740" height="610" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 5" rx="14"/>
  <text x="540" y="204" font-size="13" font-weight="700" fill="#0369a1">VNet vnet-shipops 10.20.0.0/16</text>

  <rect x="540" y="216" width="330" height="560" fill="#ffffff" stroke="#bae6fd" rx="12"/>
  <text x="556" y="238" class="l" font-weight="600">snet-appsvc 10.20.1.0/24 (VNet integration, outbound)</text>
  <text x="556" y="254" class="s">App Service Plan · Linux P1v3 · autoscale 2-6</text>

  <rect x="565" y="272" width="280" height="96" class="app"/>
  <text x="705" y="298" text-anchor="middle" class="t">app-shipops-web</text>
  <text x="705" y="317" text-anchor="middle" class="s">React build served by nginx container</text>
  <text x="705" y="334" text-anchor="middle" class="s">(alt: Azure Static Web Apps)</text>
  <text x="705" y="351" text-anchor="middle" class="s">Slots: staging → production</text>

  <rect x="565" y="400" width="280" height="122" class="app"/>
  <text x="705" y="426" text-anchor="middle" class="t">app-shipops-api</text>
  <text x="705" y="445" text-anchor="middle" class="s">Node 22 · Express · Prisma · ws</text>
  <text x="705" y="462" text-anchor="middle" class="s">Validates Entra tokens (JWKS)</text>
  <text x="705" y="479" text-anchor="middle" class="s">WebSockets ON · ARR affinity ON</text>
  <text x="705" y="496" text-anchor="middle" class="s">System-assigned Managed Identity</text>
  <text x="705" y="513" text-anchor="middle" class="s">Health check: /health/ready</text>

  <rect x="565" y="560" width="280" height="96" class="app"/>
  <text x="705" y="586" text-anchor="middle" class="t">app-shipops-analytics</text>
  <text x="705" y="605" text-anchor="middle" class="s">Python 3.12 · Flask · gunicorn</text>
  <text x="705" y="622" text-anchor="middle" class="s">Public access disabled</text>
  <text x="705" y="639" text-anchor="middle" class="s">Reachable only via private endpoint</text>

  <rect x="565" y="684" width="280" height="76" class="box"/>
  <text x="705" y="710" text-anchor="middle" class="t">Redis / Web PubSub (scale-out)</text>
  <text x="705" y="729" text-anchor="middle" class="s">Backplane for WS events across</text>
  <text x="705" y="745" text-anchor="middle" class="s">multiple API instances</text>

  <rect x="900" y="216" width="345" height="560" fill="#ffffff" stroke="#bbf7d0" rx="12"/>
  <text x="916" y="238" class="l" font-weight="600">snet-pe 10.20.2.0/24 (private endpoints)</text>
  <text x="916" y="254" class="s">Private DNS zones linked to the VNet</text>

  <rect x="925" y="272" width="295" height="104" class="data"/>
  <text x="1072" y="298" text-anchor="middle" class="t">Azure Database for PostgreSQL</text>
  <text x="1072" y="317" text-anchor="middle" class="s">Flexible Server 16 · General Purpose · zone HA</text>
  <text x="1072" y="334" text-anchor="middle" class="s">Entra auth (MI login) · PITR 35 days</text>
  <text x="1072" y="351" text-anchor="middle" class="s">Built-in PgBouncer · TLS required</text>
  <text x="1072" y="368" text-anchor="middle" class="s">public network access: disabled</text>

  <rect x="925" y="406" width="295" height="86" class="sec"/>
  <text x="1072" y="432" text-anchor="middle" class="t">Azure Key Vault</text>
  <text x="1072" y="451" text-anchor="middle" class="s">RBAC · soft delete + purge protection</text>
  <text x="1072" y="468" text-anchor="middle" class="s">App settings use @Microsoft.KeyVault(...)</text>
  <text x="1072" y="484" text-anchor="middle" class="s">refs: DB url, internal key, Graph secret</text>

  <rect x="925" y="522" width="295" height="74" class="ext"/>
  <text x="1072" y="548" text-anchor="middle" class="t">Azure OpenAI (AI Foundry)</text>
  <text x="1072" y="567" text-anchor="middle" class="s">gpt-4o-mini deployment · content filters</text>
  <text x="1072" y="583" text-anchor="middle" class="s">Keyless: Cognitive Services OpenAI User</text>

  <rect x="925" y="626" width="295" height="60" class="app"/>
  <text x="1072" y="651" text-anchor="middle" class="t">PE → analytics app</text>
  <text x="1072" y="670" text-anchor="middle" class="s">inbound private IP 10.20.2.x</text>

  <rect x="925" y="706" width="295" height="56" class="box"/>
  <text x="1072" y="730" text-anchor="middle" class="t">Microsoft Graph → SharePoint</text>
  <text x="1072" y="748" text-anchor="middle" class="s">Announcements list · called by api (Bonus 3)</text>

  <!-- Arrows -->
  <path d="M210 368 H258" class="ln"/>
  <text x="234" y="360" text-anchor="middle" class="lbl">HTTPS</text>
  <path d="M120 330 V117 H258" class="dash"/>
  <text x="128" y="230" class="lbl">sign-in (MSAL, PKCE)</text>
  <path d="M480 345 H520 V320 H563" class="ln"/>
  <path d="M480 392 H520 V460 H563" class="ln"/>
  <text x="498" y="440" class="lbl">/api /ws</text>

  <path d="M845 430 H880 V324 H923" class="ln"/>
  <text x="849" y="423" class="lbl">SQL</text>
  <path d="M845 452 H923" class="ln"/>
  <text x="849" y="446" class="lbl">MI</text>
  <path d="M845 488 H905 V559 H923" class="ln"/>
  <text x="849" y="482" class="lbl">chat</text>
  <path d="M845 505 H885 V650 H923" class="ln"/>
  <path d="M923 676 H875 V608 H847" class="ln"/>
  <text x="880" y="700" class="lbl">CSV via PE</text>

  <path d="M1220 300 H1250 V168 H830 V158" class="dash"/>
  <text x="1000" y="172" class="lbl">CDC mirroring</text>

  <path d="M210 675 H258" class="ln"/>
  <path d="M480 675 H510 V610 H563" class="dash"/>
  <text x="370" y="732" text-anchor="middle" class="lbl">deploy: image → staging slot → swap</text>
</svg>
